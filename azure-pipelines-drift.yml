# Manual drift detection on main. Queue anytime from Azure DevOps.
# Uncomment the schedule after Azure DevOps environments and service
# connections (OIDC) exist.

name: IaC-drift-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

# schedules:
#   - cron: "0 3 * * 1"
#     displayName: Weekly Monday 03:00 UTC
#     branches:
#       include:
#         - main
#     always: true

variables:
  - template: .azuredevops/variables-common.yml

stages:
  - template: .azuredevops/stages-validate-security.yml
  - template: .azuredevops/stages-drift.yml
