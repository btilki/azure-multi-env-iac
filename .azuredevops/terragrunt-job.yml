parameters:
  - name: jobName
    type: string
  - name: displayName
    type: string
  - name: azureServiceConnection
    type: string
  - name: deploymentEnvironment
    type: string
  - name: terragruntCommand
    type: string
  - name: skipDepOutputs
    type: boolean
    default: false

jobs:
  - deployment: ${{ parameters.jobName }}
    displayName: ${{ parameters.displayName }}
    environment: ${{ parameters.deploymentEnvironment }}
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
            - bash: |
                curl -fsSL "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip" -o terraform.zip
                unzip -o terraform.zip
                sudo mv terraform /usr/local/bin/terraform
                terraform version
              displayName: Install Terraform
            - bash: |
                curl -sSL -o terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v$(terragruntVersion)/terragrunt_linux_amd64"
                chmod +x terragrunt
                sudo mv terragrunt /usr/local/bin/terragrunt
              displayName: Install Terragrunt
            - task: AzureCLI@2
              displayName: Run Terragrunt
              env:
                TF_VAR_DB_PASSWORD: $(TF_VAR_DB_PASSWORD)
                TF_VAR_ADMIN_SSH_PUBLIC_KEY: $(TF_VAR_ADMIN_SSH_PUBLIC_KEY)
              inputs:
                azureSubscription: ${{ parameters.azureServiceConnection }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  if [ -z "${TF_VAR_DB_PASSWORD:-}" ]; then
                    echo "Missing required secret variable: TF_VAR_DB_PASSWORD"
                    exit 1
                  fi
                  if [ -z "${TF_VAR_ADMIN_SSH_PUBLIC_KEY:-}" ]; then
                    echo "Missing required secret variable: TF_VAR_ADMIN_SSH_PUBLIC_KEY"
                    exit 1
                  fi
                  export ARM_CLIENT_ID="${servicePrincipalId:-}"
                  export ARM_TENANT_ID="${tenantId:-}"
                  export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                  # Support both service principal secret auth and OIDC federation.
                  if [ -n "${servicePrincipalKey:-}" ]; then
                    export ARM_CLIENT_SECRET="${servicePrincipalKey}"
                  elif [ -n "${idToken:-}" ]; then
                    export ARM_USE_OIDC=true
                    export ARM_OIDC_TOKEN="${idToken}"
                  fi
                  export TF_VAR_db_password="${TF_VAR_DB_PASSWORD}"
                  export TF_VAR_admin_ssh_public_key="${TF_VAR_ADMIN_SSH_PUBLIC_KEY}"
                  export TG_SKIP_DEP_OUTPUTS="${{ parameters.skipDepOutputs }}"
                  cd "live/${{ parameters.deploymentEnvironment }}"
                  TG_CMD='${{ parameters.terragruntCommand }}'
                  set +e
                  eval "${TG_CMD}"
                  CMD_EXIT=$?
                  set -e
                  if [ "${CMD_EXIT}" -eq 2 ] && [[ "${TG_CMD}" == *"-detailed-exitcode"* ]]; then
                    echo "Terragrunt/Terraform reported drift (exit code 2 with -detailed-exitcode). Marking job successful."
                    exit 0
                  fi
                  exit "${CMD_EXIT}"
                addSpnToEnvironment: true
