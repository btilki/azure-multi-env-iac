stages:
  - stage: Validate
    displayName: Validate IaC
    jobs:
      - job: Validate
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - bash: |
              curl -fsSL "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip" -o terraform.zip
              unzip -o terraform.zip
              sudo mv terraform /usr/local/bin/terraform
              terraform version
            displayName: Install Terraform
          - bash: |
              curl -sSL -o terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v$(terragruntVersion)/terragrunt_linux_amd64"
              chmod +x terragrunt
              sudo mv terragrunt /usr/local/bin/terragrunt
            displayName: Install Terragrunt
          - bash: terraform fmt -check -recursive
            displayName: Terraform fmt check
          - bash: terragrunt hcl fmt --check
            displayName: Terragrunt HCL format check
          - bash: |
              curl -fsSL "https://github.com/terraform-linters/tflint/releases/download/v$(tflintVersion)/tflint_linux_amd64.zip" -o tflint.zip
              unzip -o tflint.zip
              sudo mv tflint /usr/local/bin/tflint
              tflint --version
              tflint --init --config "$(Build.SourcesDirectory)/.tflint.hcl"
              for dir in bootstrap modules/networking modules/compute modules/databases; do
                echo "TFLint ${dir}..."
                tflint --chdir="${dir}" --config "$(Build.SourcesDirectory)/.tflint.hcl"
              done
            displayName: TFLint (bootstrap + modules)
          - bash: |
              terraform -chdir=bootstrap init -backend=false
              terraform -chdir=bootstrap validate
            displayName: Validate bootstrap
          - bash: |
              set -euo pipefail
              export TG_SKIP_DEP_OUTPUTS=true
              export TF_VAR_db_password='ci-validate-only'
              export TF_VAR_admin_ssh_public_key='ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC3FakeKeyForCiValidateOnly user@host'
              for env in dev staging prod; do
                for unit in networking compute databases; do
                  echo "Validating live/${env}/${unit}..."
                  cd "live/${env}/${unit}"
                  terragrunt init -backend=false
                  terragrunt validate
                  cd - >/dev/null
                done
              done
            displayName: Validate Terragrunt stacks (all envs, per unit, no backend)

  - stage: Security
    displayName: Security scan
    dependsOn: Validate
    jobs:
      - job: Tfsec
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - bash: |
              curl -fsSL "https://github.com/aquasecurity/tfsec/releases/download/$(tfsecVersion)/tfsec-linux-amd64" -o tfsec
              chmod +x tfsec
              sudo mv tfsec /usr/local/bin/tfsec
              tfsec --version
              tfsec .
            displayName: Run tfsec (pinned)
